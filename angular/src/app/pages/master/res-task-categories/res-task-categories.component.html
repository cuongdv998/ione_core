<div class="grid grid-cols-12 gap-4">
  <!-- Panel tìm kiếm -->
  <div class="col-span-12">
    <p-panel [header]="'AbpAuditLogging::SearchInformation' | translate" [toggleable]="true">
      <div class="grid grid-cols-12 gap-4">
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="code" class="block mb-2 font-medium">{{ 'Master::ResTaskCategory:Code' | translate }}</label>
          <input
            pInputText
            id="code"
            [(ngModel)]="searchForm.code"
            class="w-full"
          />
        </div>
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="businessType" class="block mb-2 font-medium">{{ 'Master::ResTaskCategory:BusinessType' | translate }}</label>
          <p-select
            id="businessType"
            [(ngModel)]="searchForm.businessType"
            [options]="businessTypeOptions"
            [placeholder]="'Master::All' | translate"
            [showClear]="true"
            optionLabel="label"
            optionValue="value"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="name" class="block mb-2 font-medium">{{ 'Master::ResTaskCategory:Name' | translate }}</label>
          <input
            pInputText
            id="name"
            [(ngModel)]="searchForm.name"
            class="w-full"
          />
        </div>
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="status" class="block mb-2 font-medium">{{ 'Master::ResTaskCategory:Status' | translate }}</label>
          <p-select
            id="status"
            [(ngModel)]="searchForm.status"
            [options]="statusOptions"
            [placeholder]="'Master::All' | translate"
            [showClear]="true"
            optionLabel="label"
            optionValue="value"
            styleClass="w-full"
            appendTo="body"
          />
        </div>
        <div class="col-span-12 flex gap-2 justify-end">
          <p-button
            [label]="'AbpAuditLogging::Reset' | translate"
            icon="pi pi-refresh"
            severity="secondary"
            (onClick)="resetSearch()"
          />
          <p-button
            [label]="'AbpAuditLogging::Search' | translate"
            icon="pi pi-search"
            (onClick)="search()"
          />
          <p-button
            *ngIf="PERMISSIONS.CREATE | appPermission"
            [label]="'Master::ResTaskCategory:New' | translate"
            icon="pi pi-plus"
            (onClick)="openCreateDialog()"
          />
        </div>
      </div>
    </p-panel>
  </div>

  <!-- Panel dữ liệu -->
  <div class="col-span-12">
    <p-panel [header]="'AbpAuditLogging::DataList' | translate">
      <app-v-table
        [columns]="columns"
        [data]="items"
        [actions]="actions"
        [totalCount]="totalCount"
        [loading]="loading"
        [rows]="pageSize"
        [rowsPerPageOptions]="[10, 20, 50, 100]"
        [showGridlines]="true"
        [stripedRows]="true"
        [rowHover]="true"
        size="small"
        [scrollHeight]="'calc(100vh - 400px)'"
        (lazyLoad)="loadData($event)"
      />
    </p-panel>
  </div>
</div>

<!-- Dialog Create/Edit -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="(dialogMode === 'create' ? 'Master::ResTaskCategory:New' : 'Master::ResTaskCategory:Edit') | translate"
  [modal]="true"
  [style]="{ width: '600px', maxHeight: '90vh' }"
  [draggable]="false"
  [resizable]="false"
  [contentStyle]="{ overflow: 'visible' }"
>
  <div class="flex flex-col gap-4 p-4">
    <!-- Loại nghiệp vụ (BusinessType) -->
    <div>
      <label for="formBusinessType" class="block mb-2 font-medium">
        {{ 'Master::ResTaskCategory:BusinessType' | translate }}
        <span class="text-red-500" *ngIf="dialogMode === 'create'">*</span>
      </label>
      <p-select
        id="formBusinessType"
        [(ngModel)]="formData.businessType"
        [options]="businessTypeOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
        [disabled]="dialogMode === 'edit'"
      />
      <small *ngIf="dialogMode === 'edit'" class="text-gray-500 block mt-1">
        {{ 'Master::ResTaskCategory:BusinessTypeCannotBeChanged' | translate }}
      </small>
    </div>

    <!-- Mã công việc (Code) -->
    <div>
      <label for="formCode" class="block mb-2 font-medium">
        {{ 'Master::ResTaskCategory:Code' | translate }}
        <span class="text-red-500" *ngIf="dialogMode === 'create'">*</span>
      </label>
      <input
        pInputText
        id="formCode"
        [(ngModel)]="formData.code"
        [readonly]="dialogMode === 'edit'"
        class="w-full"
        [class.bg-gray-100]="dialogMode === 'edit'"
        (input)="onCodeInput($event)"
        maxlength="50"
      />
      <small class="text-gray-500" *ngIf="dialogMode === 'create'">{{ 'Master::ResTaskCategory:CodeInvalid' | translate }}</small>
      <small *ngIf="dialogMode === 'edit'" class="text-gray-500 block mt-1">
        {{ 'Master::ResTaskCategory:CodeCannotBeChanged' | translate }}
      </small>
    </div>

    <!-- Tên công việc (Name) -->
    <div>
      <label for="formName" class="block mb-2 font-medium">
        {{ 'Master::ResTaskCategory:Name' | translate }}
        <span class="text-red-500">*</span>
      </label>
      <input
        pInputText
        id="formName"
        [(ngModel)]="formData.name"
        class="w-full"
        maxlength="250"
      />
    </div>

    <!-- Trạng thái (Status) -->
    <div>
      <label for="formStatus" class="block mb-2 font-medium">
        {{ 'Master::ResTaskCategory:Status' | translate }}
        <span class="text-red-500">*</span>
      </label>
      <p-select
        id="formStatus"
        [(ngModel)]="formData.status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'Master::Cancel' | translate"
        severity="secondary"
        (onClick)="dialogVisible = false"
        [disabled]="loading"
      />
      <p-button
        [label]="'Master::Save' | translate"
        (onClick)="save()"
        [loading]="loading"
      />
    </div>
  </ng-template>
</p-dialog>

<p-toast />
<p-confirmDialog />

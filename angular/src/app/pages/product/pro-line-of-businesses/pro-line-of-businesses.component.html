<div class="grid grid-cols-12 gap-4">
    <!-- Search Panel -->
    <div class="col-span-12">
        <p-panel [header]="'Product::SearchInformation' | translate" [toggleable]="true">
            <div class="grid grid-cols-12 gap-4">
                <!-- Code -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label for="searchCode" class="block mb-2 font-medium">{{ 'Product::ProLineOfBusiness:Code' |
                        translate }}</label>
                    <input pInputText id="searchCode" [(ngModel)]="searchForm.code" class="w-full" />
                </div>

                <!-- Name -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label for="searchName" class="block mb-2 font-medium">{{ 'Product::ProLineOfBusiness:Name' |
                        translate }}</label>
                    <input pInputText id="searchName" [(ngModel)]="searchForm.name" class="w-full" />
                </div>

                <!-- Parent -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label for="searchParent" class="block mb-2 font-medium">Nghiệp vụ cha</label>
                    <p-select inputId="searchParent" [(ngModel)]="searchForm.parentId" [options]="parentOptions"
                        optionLabel="label" optionValue="value" [filter]="true" filterBy="label" [showClear]="true"
                        styleClass="w-full" [placeholder]="'Chọn nghiệp vụ cha'" />
                </div>

                <!-- Status -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label for="searchStatus" class="block mb-2 font-medium">{{ 'Product::ProLineOfBusiness:Status'
                        |
                        translate }}</label>
                    <p-select inputId="searchStatus" [(ngModel)]="searchForm.status" [options]="statusOptions"
                        optionLabel="label" optionValue="value"
                        [placeholder]="'Product::ProLineOfBusiness:SelectStatus' | translate" styleClass="w-full"
                        [showClear]="true" />
                </div>

                <!-- Buttons -->
                <div class="col-span-12 flex gap-2 justify-end">
                    <p-button [label]="'Product::Reset' | translate" icon="pi pi-refresh" severity="secondary"
                        (onClick)="resetSearch()" />
                    <p-button [label]="'Product::Search' | translate" icon="pi pi-search" (onClick)="search()" />
                    <button pButton class="p-panel-header-icon" icon="pi pi-plus" (click)="openCreateDialog()"
                        *ngIf="PERMISSIONS.CREATE | appPermission" [pTooltip]="'Product::Create' | translate"
                        [label]="'Product::Create' | translate">
                    </button>
                </div>
            </div>
        </p-panel>
    </div>

    <!-- Data List Panel -->
    <div class="col-span-12">
        <p-panel [header]="'Product::ProLineOfBusiness:List' | translate">


            <app-v-table [columns]="columns" [data]="items" [actions]="actions" [totalCount]="totalCount"
                [loading]="loading" [rows]="pageSize" [rowsPerPageOptions]="[10, 20, 50]" [showGridlines]="true"
                [stripedRows]="true" [rowHover]="true" size="small" [scrollHeight]="'calc(100vh - 400px)'"
                (lazyLoad)="loadData($event)" />
        </p-panel>
    </div>
</div>

<!-- Create/Edit Dialog -->
<p-dialog [(visible)]="dialogVisible"
    [header]="(dialogMode === 'create' ? 'Product::Create' : (dialogMode === 'edit' ? 'Product::Edit' : 'Product::View')) | translate"
    [modal]="true" [style]="{ width: '40vw' }" [draggable]="false" [resizable]="false">
    <div class="grid grid-cols-12 gap-4 pt-4" *ngIf="formData">
        <!-- Code -->
        <div class="col-span-12">
            <label for="code" class="block mb-2 font-medium required">{{ 'Product::ProLineOfBusiness:Code' | translate
                }} <span class="text-red-500">*</span></label>
            <input pInputText id="code" [(ngModel)]="formData.code" class="w-full"
                [ngClass]="{ 'ng-invalid ng-dirty': formErrors.code }"
                [disabled]="dialogMode === 'edit' || dialogMode === 'view'" required pattern="^[a-zA-Z0-9_]+$"
                (blur)="formData.code = formData.code?.trim()"
                style="text-transform: uppercase" (input)="formData.code = formData.code?.toUpperCase()" />
        </div>

        <!-- Name -->
        <div class="col-span-12">
            <label for="name" class="block mb-2 font-medium required">{{ 'Product::ProLineOfBusiness:Name' | translate
                }} <span class="text-red-500">*</span></label>
            <input pInputText id="name" [(ngModel)]="formData.name" class="w-full" [disabled]="dialogMode === 'view'"
                [ngClass]="{ 'ng-invalid ng-dirty': formErrors.name }"
                required />
        </div>

        <!-- Parent -->
        <div class="col-span-12">
            <label for="parent" class="block mb-2 font-medium">Nghiệp vụ cha</label>
            <p-select inputId="parent" [(ngModel)]="formData.parentId" [options]="dialogParentOptions"
                optionLabel="label" optionValue="value" [filter]="true" filterBy="label" [showClear]="true"
                styleClass="w-full" [disabled]="dialogMode === 'view'" />
        </div>

        <!-- Status -->
        <div class="col-span-12">
            <label for="status" class="block mb-2 font-medium required">{{ 'Product::ProLineOfBusiness:Status' |
                translate }} <span class="text-red-500">*</span></label>
            <p-select inputId="status" [(ngModel)]="formData.status" [options]="statusOptions" optionLabel="label"
                optionValue="value" styleClass="w-full" [disabled]="dialogMode === 'view'"
                [ngClass]="{ 'ng-invalid ng-dirty': formErrors.status }" />
        </div>

        <!-- Description -->
        <div class="col-span-12">
            <label for="description" class="block mb-2 font-medium">{{ 'Product::ProLineOfBusiness:Description' |
                translate }}</label>
            <textarea pTextarea id="description" [(ngModel)]="formData.description" rows="3" class="w-full"
                [disabled]="dialogMode === 'view'"></textarea>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <p-button [label]="'Product::Cancel' | translate" icon="pi pi-times" severity="secondary"
            (onClick)="dialogVisible = false" />
        <p-button *ngIf="dialogMode !== 'view'" [label]="'Product::Save' | translate" icon="pi pi-check"
            (onClick)="save()" [loading]="loading" />
    </ng-template>
</p-dialog>

<p-toast />
<p-confirmDialog />

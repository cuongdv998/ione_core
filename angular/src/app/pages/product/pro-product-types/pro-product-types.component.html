<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
<div class="grid grid-cols-12 gap-4">
    <!-- Search Panel -->
    <div class="col-span-12">
        <p-panel [header]="'Tìm kiếm thông tin'" [toggleable]="true">
            <div class="grid grid-cols-12 gap-4">
                <!-- Code -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label class="block mb-2 font-medium">Mã loại sản phẩm</label>
                    <input pInputText [(ngModel)]="searchForm.code" (ngModelChange)="searchForm.code = $event?.toUpperCase()" class="w-full" (keydown.enter)="search()" />
                </div>
                <!-- Name -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label class="block mb-2 font-medium">Tên loại sản phẩm</label>
                    <input pInputText [(ngModel)]="searchForm.name" class="w-full" (keydown.enter)="search()" />
                </div>
                <!-- Line of Business -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label class="block mb-2 font-medium">Nghiệp vụ</label>
                    <p-select [options]="fullLobOptions" [(ngModel)]="searchForm.lobId" optionLabel="label"
                        optionValue="value" [showClear]="true" [filter]="true" filterBy="label" (onChange)="search()"
                        placeholder="Chọn nghiệp vụ" styleClass="w-full">
                    </p-select>
                </div>
                <!-- Status -->
                <div class="col-span-12 md:col-span-6 lg:col-span-3">
                    <label class="block mb-2 font-medium">Trạng thái</label>
                    <p-select [options]="statusOptions" [(ngModel)]="searchForm.status" optionLabel="label"
                        optionValue="value" [showClear]="true" (onChange)="search()" placeholder="Chọn trạng thái"
                        styleClass="w-full">
                    </p-select>
                </div>
                <!-- Buttons -->
                <div class="col-span-12 flex gap-2 justify-end">
                    <button pButton icon="pi pi-refresh" label="Làm mới" class="p-button-secondary"
                        (click)="resetSearch()"></button>
                    <button pButton icon="pi pi-search" label="Tìm kiếm" (click)="search()"></button>
                    <button label="Thêm mới" *ngIf="PERMISSIONS.CREATE | appPermission" pButton
                        class="p-panel-header-icon" icon="pi pi-plus" (click)="openCreateDialog()"
                        pTooltip="Thêm mới">
                    </button>
                </div>
            </div>
        </p-panel>
    </div>  

    <!-- Data List Panel -->
    <div class="col-span-12">
        <p-panel [header]="'Danh mục loại sản phẩm'">
            <app-v-table [columns]="columns" [data]="items" [totalCount]="totalCount" [loading]="loading"
                [actions]="actions" (lazyLoad)="loadData($event)" [scrollHeight]="'calc(100vh - 400px)'">
            </app-v-table>
        </p-panel>
    </div>
</div>

<!-- Create/Edit Dialog -->
<p-dialog [header]="dialogMode === 'create' ? 'Thêm mới' : 'Chỉnh sửa'" [(visible)]="dialogVisible" [modal]="true"
    [style]="{ width: '40vw' }" [draggable]="false" [resizable]="false">
    <div class="grid grid-cols-12 gap-4 pt-4" *ngIf="formData">
        <!-- Line of Business (Required) -->
        <div class="col-span-12">
            <label for="lobId" class="block mb-2 font-medium">Nghiệp vụ <span class="text-red-500">*</span></label>
            <p-select id="lobId" [options]="lobOptions" [(ngModel)]="formData.lobId" optionLabel="label"
                optionValue="value" [filter]="true" filterBy="label" placeholder="Chọn nghiệp vụ" appendTo="body"
                styleClass="w-full">
            </p-select>
        </div>

        <!-- Code (Required) -->
        <div class="col-span-12">
            <label for="code" class="block mb-2 font-medium">Mã loại sản phẩm <span
                    class="text-red-500">*</span></label>
            <input pInputText id="code" [(ngModel)]="formData.code" (ngModelChange)="formData.code = $event?.toUpperCase()" class="w-full" required
                [disabled]="dialogMode === 'edit'" />
        </div>

        <!-- Name (Required) -->
        <div class="col-span-12">
            <label for="name" class="block mb-2 font-medium">Tên loại sản phẩm <span
                    class="text-red-500">*</span></label>
            <input pInputText id="name" [(ngModel)]="formData.name" class="w-full" required />
        </div>

        <!-- Status (Required) -->
        <div class="col-span-12">
            <label for="status" class="block mb-2 font-medium">Trạng thái <span class="text-red-500">*</span></label>
            <p-select id="status" [options]="statusOptions" [(ngModel)]="formData.status" optionLabel="label"
                optionValue="value" placeholder="Chọn trạng thái" appendTo="body" styleClass="w-full">
            </p-select>
        </div>

        <!-- Description -->
        <div class="col-span-12">
            <label for="description" class="block mb-2 font-medium">Mô tả</label>
            <textarea pTextarea id="description" [(ngModel)]="formData.description" rows="3" class="w-full"></textarea>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button pButton label="Hủy" icon="pi pi-times" class="p-button-secondary"
            (click)="dialogVisible = false"></button>
        <button pButton label="Lưu" icon="pi pi-check" (click)="save()" [loading]="loading"></button>
    </ng-template>
</p-dialog>

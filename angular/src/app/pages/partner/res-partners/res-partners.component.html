<div class="grid grid-cols-12 gap-4">
  <!-- Panel tìm kiếm -->
  <div class="col-span-12">
    <p-panel [header]="'AbpAuditLogging::SearchInformation' | translate" [toggleable]="true">
      <div class="grid grid-cols-12 gap-4" (keydown.enter)="search()">
        <!-- Tìm theo Code -->
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="code" class="block mb-2 font-medium">{{ 'Partner::ResPartner:Code' | translate }}</label>
          <input pInputText id="code" [(ngModel)]="searchForm.code" class="w-full" />
        </div>

        <!-- Tìm theo Name -->
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="name" class="block mb-2 font-medium">{{ 'Partner::ResPartner:Name' | translate }}</label>
          <input pInputText id="name" [(ngModel)]="searchForm.name" class="w-full" />
        </div>

        <!-- Filter theo Partner Type -->
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="partnerTypeId" class="block mb-2 font-medium">{{ 'Partner::ResPartner:PartnerType' | translate
            }}</label>
          <p-select id="partnerTypeId" [(ngModel)]="searchForm.partnerTypeId" [options]="partnerTypeOptions"
            [placeholder]="'Partner::All' | translate" [showClear]="true" optionLabel="label" optionValue="value"
            styleClass="w-full" appendTo="body" />
        </div>

        <!-- Filter theo Status -->
        <div class="col-span-12 md:col-span-6 lg:col-span-3">
          <label for="status" class="block mb-2 font-medium">{{ 'Partner::ResPartner:Status' | translate }}</label>
          <p-select id="status" [(ngModel)]="searchForm.status" [options]="statusOptions"
            [placeholder]="'Partner::All' | translate" [showClear]="true" optionLabel="label" optionValue="value"
            styleClass="w-full" appendTo="body" />
        </div>

        <!-- Buttons -->
        <div class="col-span-12 flex gap-2 justify-end">
          <p-button [label]="'AbpAuditLogging::Reset' | translate" icon="pi pi-refresh" severity="secondary"
            (onClick)="resetSearch()" />
          <p-button [label]="'AbpAuditLogging::Search' | translate" icon="pi pi-search" (onClick)="search()" />
          <p-button *ngIf="PERMISSIONS.CREATE | appPermission" [label]="'Partner::ResPartner:New' | translate"
            icon="pi pi-plus" (onClick)="openCreateDialog()" />
        </div>
      </div>
    </p-panel>
  </div>

  <!-- Panel dữ liệu -->
  <div class="col-span-12">
    <p-panel [header]="'AbpAuditLogging::DataList' | translate">
      <app-v-table [columns]="columns" [data]="resPartners" [actions]="actions" [totalCount]="totalCount"
        [loading]="loading" [rows]="pageSize" [rowsPerPageOptions]="[10, 20, 50, 100]" [showGridlines]="true"
        [stripedRows]="true" [rowHover]="true" size="small" [scrollHeight]="'calc(100vh - 400px)'"
        (lazyLoad)="loadData($event)" />
    </p-panel>
  </div>
</div>

<app-res-partner-form-dialog
  [(visible)]="partnerDialogVisible"
  [mode]="partnerDialogMode"
  [partnerId]="partnerEditId"
  (saved)="onPartnerSaved($event)"
/>

<!-- Toast Messages -->
<p-toast />

<!-- Confirmation Dialog -->
<p-confirmDialog />

<p-dialog
  [(visible)]="visible"
  (visibleChange)="onVisibleChange($event)"
  header="Giao việc giám định chi tiết"
  [modal]="true"
  [style]="{ width: '44rem', maxWidth: '95vw' }"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
>
  <div class="grid grid-cols-12 gap-3">
    <div class="col-span-12 md:col-span-6">
      <label for="reassignOrg" class="block mb-2 font-medium">Đơn vị giám định <span class="text-red-500">*</span></label>
      <p-select
        id="reassignOrg"
        [(ngModel)]="assigneeOrganizationId"
        [options]="departmentOptions"
        [loading]="loadingDepartments"
        [filter]="true"
        [showClear]="true"
        optionLabel="label"
        optionValue="value"
        placeholder="Chọn đơn vị giám định"
        styleClass="w-full"
        appendTo="body"
        (onChange)="onDepartmentChange()"
      />
    </div>

    <div class="col-span-12 md:col-span-6">
      <label for="reassignEmp" class="block mb-2 font-medium">Người giám định <span class="text-red-500">*</span></label>
      <p-select
        id="reassignEmp"
        [(ngModel)]="assigneeId"
        [options]="employeeOptions"
        [loading]="loadingEmployees"
        [filter]="true"
        [showClear]="true"
        [disabled]="!assigneeOrganizationId"
        optionLabel="label"
        optionValue="value"
        placeholder="Chọn người giám định"
        styleClass="w-full"
        appendTo="body"
      />
    </div>

    <div class="col-span-12 md:col-span-6">
      <label for="reassignStartDate" class="block mb-2 font-medium">Ngày giám định <span class="text-red-500">*</span></label>
      <p-datepicker
        inputId="reassignStartDate"
        [(ngModel)]="startDate"
        [showIcon]="true"
        [showTime]="true"
        hourFormat="24"
        dateFormat="dd/mm/yy"
        styleClass="w-full"
        appendTo="body"
      />
    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        label="Hủy"
        severity="secondary"
        [outlined]="true"
        [disabled]="saving"
        (onClick)="confirmClose()"
      />
      <p-button
        label="Thực hiện"
        [loading]="saving"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-dialog>

<p-confirmDialog />
<p-toast />

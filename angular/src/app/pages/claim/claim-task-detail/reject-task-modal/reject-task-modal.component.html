<p-dialog
  [(visible)]="visible"
  (visibleChange)="onVisibleChange($event)"
  [header]="'Claim::RejectReason' | translate"
  [modal]="true"
  [style]="{ width: '480px' }"
  [draggable]="false"
  [resizable]="false"
  (onShow)="focusExecuteButton()"
  (onHide)="close()"
>
  <div class="grid grid-cols-12 gap-4 p-2">
    <div class="col-span-12">
      <label for="reasonId" class="block mb-2 font-medium">{{ 'Claim::Reason' | translate }} <span class="text-red-500">*</span> </label>
      <p-select
        id="reasonId"
        [(ngModel)]="reasonId"
        [options]="reasonOptions"
        [placeholder]="'Claim::SelectReason' | translate"
        [showClear]="true"
        [loading]="loadingReasons"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
      />
    </div>
    <div class="col-span-12">
      <label for="reasonDescription" class="block mb-2 font-medium">
        {{ 'Claim::Description' | translate }} <span class="text-red-500">*</span>
      </label>
      <textarea
        pTextarea
        id="reasonDescription"
        [(ngModel)]="reasonDescription"
        required
        [rows]="4"
        class="w-full"
      ></textarea>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button [label]="'Claim::Cancel' | translate" severity="secondary" (onClick)="close()" [disabled]="saving" />
    <p-button
      [label]="'Claim::Execute' | translate"
      severity="danger"
      styleClass="reject-execute-button"
      (onClick)="submit()"
      [loading]="saving"
    />
  </ng-template>
</p-dialog>
<p-toast />

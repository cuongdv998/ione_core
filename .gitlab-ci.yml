# GitLab CI Main Configuration
# Include CI cho Backend và Frontend (tách job, có thể chạy song song).
#
# Dev (nhánh develop): build artifact → image → push registry → docker-compose trên runner.
# Production (nhánh master): chỉ build artifact → image → push registry (không deploy tự động).
#
# Pipeline từ web (manual), chọn BUILD_TYPE:
# - BE: chỉ Backend (dev đầy đủ tới deploy)
# - FE: chỉ Frontend (dev đầy đủ tới deploy)
# - ALL: cả BE và FE (dev đầy đủ tới deploy)

workflow:
  rules:
    # Luôn chạy pipeline khi push code
    - if: '$CI_PIPELINE_SOURCE == "push"'
    # Chạy pipeline khi trigger từ web (manual)
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # Không chạy trong các trường hợp khác
    - when: never

include:
  - local: 'ci/.gitlab-ci-be.yml'
  - local: 'ci/.gitlab-ci-fe.yml'

variables:
  BUILD_TYPE:
    value: "BE"
    description: "Chỉ áp dụng khi Run pipeline từ web"
    options:
      - "BE"
      - "FE"
      - "ALL"

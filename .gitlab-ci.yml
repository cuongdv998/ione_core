# GitLab CI Main Configuration
# Include CI cho Backend và Frontend (tách job, có thể chạy song song).
#
# Nhánh main: build artifact → image → push registry (không deploy tự động trong CI).
# Deploy production: chạy tay trên server qua deploy/deploy.sh.
#
# Pipeline từ web (manual, nhánh main), chọn BUILD_TYPE:
# - BE: chỉ Backend
# - FE: chỉ Frontend
# - ALL: cả BE và FE

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
    - when: never

include:
  - local: 'ci/.gitlab-ci-be.yml'
  - local: 'ci/.gitlab-ci-fe.yml'

variables:
  BUILD_TYPE:
    value: "BE"
    description: "Chỉ áp dụng khi Run pipeline từ web"
    options:
      - "BE"
      - "FE"
      - "ALL"

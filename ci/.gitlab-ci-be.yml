# GitLab CI — Backend (.NET)
# master: build → image → push (không deploy tự động).

stages:
  - build
  - docker

variables:
  DOTNET_VERSION: "9.0.x"
  SOLUTION_PATH: "iOne.sln"
  API_PROJECT_PATH: "src/web/iOne.HttpApi.Host/iOne.HttpApi.Host.csproj"
  DOCKER_IMAGE_API: "ione-api"
  DOCKER_REGISTRY: "${CI_REGISTRY}"
  DOCKER_IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  # Make NuGet cacheable across container builds
  NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"

# .NET Build Job
build:dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && ($BUILD_TYPE == "BE" || $BUILD_TYPE == "ALL" || $BUILD_TYPE == null || $BUILD_TYPE == "")'
  script:
    - echo "Restoring NuGet packages..."
    - dotnet restore $SOLUTION_PATH --packages "$NUGET_PACKAGES"
    - echo "Building solution..."
    - dotnet build $SOLUTION_PATH --configuration Release --no-restore
    - echo "Publishing API Host..."
    - dotnet publish $API_PROJECT_PATH --configuration Release --output src/web/iOne.HttpApi.Host/bin/Release/net9.0/publish --no-build
  artifacts:
    paths:
      - src/web/iOne.HttpApi.Host/bin/Release/net9.0/publish/
    expire_in: 1 hour
  cache:
    key:
      files:
        - NuGet.Config
        - common.props
      prefix: ${CI_COMMIT_REF_SLUG}-nuget
    policy: pull-push
    paths:
      - .nuget/packages/

# Build Docker Image for API
docker:build:api:
  stage: docker
  image: docker:latest
  services:
    - name: docker:24-dind
      command:
        - "--insecure-registry=217.216.73.213:5000"
  variables:
    # Enable Docker layer caching with registry-backed cache image
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && ($BUILD_TYPE == "BE" || $BUILD_TYPE == "ALL" || $BUILD_TYPE == null || $BUILD_TYPE == "")'
  needs:
    - job: build:dotnet
      optional: false
  before_script:
    # Biến CI_REGISTRY_USER / CI_REGISTRY_PASSWORD cấu hình trong GitLab CI/CD Variables
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Building Docker image for API..."
    - cd src/web/iOne.HttpApi.Host
    - docker pull $DOCKER_REGISTRY/$DOCKER_IMAGE_API:buildcache || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $DOCKER_REGISTRY/$DOCKER_IMAGE_API:buildcache -t $DOCKER_REGISTRY/$DOCKER_IMAGE_API:$DOCKER_IMAGE_TAG -t $DOCKER_REGISTRY/$DOCKER_IMAGE_API:buildcache .
    - echo "Pushing Docker image for API..."
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE_API:$DOCKER_IMAGE_TAG
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE_API:buildcache

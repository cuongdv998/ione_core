# GitLab CI — Frontend (Angular)
# main: build → image → push (không deploy tự động).

stages:
  - build
  - docker

variables:
  NODE_VERSION: "20"
  ANGULAR_DIR: "angular"
  DOCKER_IMAGE_ANGULAR: "ione-angular"
  DOCKER_REGISTRY: "${CI_REGISTRY}"
  DOCKER_IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  # Speed up FE pipeline by caching package/tool downloads
  YARN_CACHE_FOLDER: "${CI_PROJECT_DIR}/.yarn-cache"
  NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"
  DOTNET_TOOLS_DIR: "${CI_PROJECT_DIR}/.dotnet/tools"

# Angular Build Job
build:angular:
  stage: build
  image: node:${NODE_VERSION}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main" && ($BUILD_TYPE == "FE" || $BUILD_TYPE == "ALL" || $BUILD_TYPE == null || $BUILD_TYPE == "")'
  before_script:
    - corepack enable
    - apt-get update
    - apt-get install -y wget apt-transport-https
    - wget https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb
    - dpkg -i packages-microsoft-prod.deb
    - apt-get update
    - apt-get install -y dotnet-sdk-9.0
    # Install ABP CLI to a project-local tool path so GitLab cache can persist it
    - dotnet tool install --tool-path "$DOTNET_TOOLS_DIR" volo.abp.cli --version 9.0.3 || dotnet tool update --tool-path "$DOTNET_TOOLS_DIR" volo.abp.cli --version 9.0.3
    - export PATH="$PATH:$DOTNET_TOOLS_DIR"
    - abp --version
    - cd $ANGULAR_DIR
    # Yarn v1 cache is NOT in angular/.yarn/cache; use an explicit cache folder we can persist
    - yarn install --frozen-lockfile --cache-folder "$YARN_CACHE_FOLDER"
  script:
    - |
      API_BASE_URL="https://api.ibds.com.vn"
      ANGULAR_BUILD_CONFIGURATION="production"
      export ABP_HOST="$API_BASE_URL"
      echo "Using API base URL: $API_BASE_URL"
      echo "Using Angular build configuration: $ANGULAR_BUILD_CONFIGURATION"
    - echo "Generating ABP proxies first time"
    - yarn generate-proxy:all
    - echo "Generating ABP proxies second time"
    - yarn generate-proxy:all
    - echo "Building Angular application..."
    - yarn build --configuration "$ANGULAR_BUILD_CONFIGURATION"
  artifacts:
    paths:
      - $ANGULAR_DIR/dist/
    expire_in: 1 hour
  cache:
    key:
      files:
        - angular/yarn.lock
      prefix: ${CI_COMMIT_REF_SLUG}-angular
    policy: pull-push
    paths:
      - .yarn-cache/
      - $ANGULAR_DIR/node_modules/
      - .nuget/packages/
      - .dotnet/tools/

# Build Docker Image for Angular
docker:build:angular:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    # Enable Docker layer caching with registry-backed cache image
    DOCKER_BUILDKIT: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main" && ($BUILD_TYPE == "FE" || $BUILD_TYPE == "ALL" || $BUILD_TYPE == null || $BUILD_TYPE == "")'
  needs:
    - job: build:angular
      optional: false
  before_script:
    - echo "DOCKER_REGISTRY=$DOCKER_REGISTRY"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Building Docker image for Angular..."
    - cd $ANGULAR_DIR
    - echo "Build artifacts found, building Docker image..."
    - docker pull $DOCKER_REGISTRY/$DOCKER_IMAGE_ANGULAR:buildcache || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $DOCKER_REGISTRY/$DOCKER_IMAGE_ANGULAR:buildcache -t $DOCKER_REGISTRY/$DOCKER_IMAGE_ANGULAR:$DOCKER_IMAGE_TAG -t $DOCKER_REGISTRY/$DOCKER_IMAGE_ANGULAR:buildcache .
    - echo "Pushing Docker image for Angular to $DOCKER_REGISTRY..."
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE_ANGULAR:$DOCKER_IMAGE_TAG
    - docker push $DOCKER_REGISTRY/$DOCKER_IMAGE_ANGULAR:buildcache
